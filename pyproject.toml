[tool.poetry]
name = "tno-portal"
version = "0.1.0"
description = "Flask portal for TNO, TON, and TCF alliance workflows."
authors = ["Aaron"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
flask = "3.1.3"
gunicorn = "26.2.0"
prometheus-client = "0.26.0"
pymongo = "4.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
coverage = "7.16.0"
mongomock = "4.3.0"
pygments = ">=2.20.0,<3.0.0"
ruff = "0.16.4"
bandit = "1.9.4"
pip-audit = "2.10.1"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
